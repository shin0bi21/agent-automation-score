name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  merge-path:
    name: Enforce develop to main
    runs-on: ubuntu-latest
    steps:
      - name: Block non-develop pull requests targeting main
        if: github.base_ref == 'main' && github.head_ref != 'develop'
        run: |
          echo "Pull requests to main must come from develop, not '${{ github.head_ref }}'."
          exit 1

  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:skills
      - run: npm run validate:docs
      - run: npm run tooling:check
      - run: npm run backend:check
      - run: npm test
      - run: npm run web:check
      - run: npm run test:web
      - run: npm run backend:build
      - run: npm run web:build
      - run: npm run docker:config
      - run: npm run docker:build
